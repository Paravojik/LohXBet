{% load tailwind_cli %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LOHxBET{% endblock %}</title>
    {% tailwind_css %}
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100">
    <header class="flex w-full flex-col gap-4 bg-blue-600 px-6 py-4 text-white sm:flex-row sm:items-center sm:justify-between">
        <h1 class="text-2xl font-bold"><a href="{% url 'home' %}">Welcome to LOHxBET</a></h1>
        <div class="flex flex-wrap items-center gap-3">
            {% if user.is_authenticated %}
                <p>Logged in as: <strong>{{ user.username }}</strong></p>
                <form action="{% url 'logout' %}" method="post" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="rounded bg-white px-3 py-2 text-sm font-medium text-blue-600 hover:bg-blue-50">
                        Log out
                    </button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="rounded px-3 py-2 hover:bg-blue-500">Log in</a>
                <a href="{% url 'register' %}" class="rounded bg-white px-3 py-2 text-sm font-medium text-blue-600 hover:bg-blue-50">
                    Sign up
                </a>
            {% endif %}
        </div>
    </header>
    <main class="mx-auto max-w-5xl px-6 py-8">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
