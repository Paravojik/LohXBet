{% extends 'layout.html' %}
{% block title %}Log In - LOHxBET{% endblock %}
{% block content %}
<section class="mx-auto max-w-md rounded-lg bg-white p-6 shadow-md ring-1 ring-blue-100 dark:bg-slate-800 dark:ring-slate-700">
    <h2 class="mb-1 text-2xl font-bold text-blue-700 dark:text-blue-300">Log in</h2>
    <p class="mb-6 text-sm text-slate-500 dark:text-slate-300">Welcome back.</p>

    <form method="post" class="space-y-4 [&_input]:w-full [&_input]:rounded-md [&_input]:border [&_input]:border-slate-300 [&_input]:px-3 [&_input]:py-2 [&_input]:focus:border-blue-500 [&_input]:focus:outline-none [&_input]:focus:ring-2 [&_input]:focus:ring-blue-200 [&_label]:mb-1 [&_label]:block [&_label]:text-sm [&_label]:font-medium [&_label]:text-slate-700 [&_label]:dark:text-slate-200 [&_ul]:text-sm [&_ul]:text-red-600">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="cursor-pointer w-full rounded-md bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700">
            Log in
        </button>
    </form>

    <p class="mt-5 text-center text-sm text-slate-600 dark:text-slate-300">
        Do not have an account?
        <a href="{% url 'register' %}" class="font-medium text-blue-600 hover:underline dark:text-blue-300">Sign up</a>
    </p>
</section>
{% endblock %}
