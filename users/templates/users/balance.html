{% extends 'layout.html' %}
{% block title %}Balance - LOHxBET{% endblock %}
{% block content %}
<section class="mx-auto max-w-md rounded-lg bg-white p-6 shadow-md ring-1 ring-blue-100 dark:bg-slate-800 dark:ring-slate-700">
    <h2 class="mb-1 text-2xl font-bold text-blue-700 dark:text-blue-300">Balance</h2>
    <p class="mb-6 text-sm text-slate-500 dark:text-slate-300">Manage the funds in your account.</p>

    <div class="mb-6 rounded-md bg-blue-50 p-4  ring-blue-100 dark:bg-slate-700 dark:ring-slate-600">
        <p class="text-sm text-slate-500 dark:text-slate-300">Your current balance</p>
        <p class="mt-1 text-3xl font-bold text-blue-700 dark:text-blue-300">
            {{ user.userprofile.userBalance|floatformat:2 }}$
        </p>
    </div>

    <h3 class="mb-3 text-lg font-semibold text-slate-700 dark:text-slate-200">Add more funds</h3>
    <form action="" method="post" class="space-y-4 [&_input]:w-full [&_input]:rounded-md [&_input]:border [&_input]:border-slate-300 [&_input]:px-3 [&_input]:py-2 [&_input]:focus:border-blue-500 [&_input]:focus:outline-none [&_input]:focus:ring-2 [&_input]:focus:ring-blue-200">
        {% csrf_token %}
        <input type="number" name="amount" placeholder="Enter amount" step="0.01" min="0.01" required
               aria-label="Amount to add">
        <button type="submit" class="cursor-pointer w-full rounded-md bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700">
            Add funds
        </button>
    </form>
</section>
{% endblock %}
